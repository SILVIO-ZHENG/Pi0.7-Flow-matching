name: Test
on:
  pull_request:
    branches:
      - "*"

jobs:
  core_contracts:
    name: G1 core contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Compile project sources
        run: python -m compileall -q src scripts examples/unitree_g1 ros2_ws/src/g1_pi07_bringup

      - name: Run hardware-independent tests
        env:
          PYTHONPATH: src
        run: uv run --no-project --python 3.11 --with numpy --with pytest pytest tests -q
